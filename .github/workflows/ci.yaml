name: ci-checks

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa  # v10.3.1
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest
      - name: Tests without dev deps (like prod)
        run: uv run --no-dev --with pytest pytest

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          file: docker/Dockerfile.app
          push: false
          load: true
          tags: fwf-ci:test
      - name: Smoke test as random OpenShift-style UID
        run: |
          docker run --rm --user 1000690000:0 \
            -e HATTRICK_OAUTH_CONSUMER_KEY=dummy \
            -e HATTRICK_OAUTH_CONSUMER_SECRET=dummy \
            -e FLASK_SECRET=dummy \
            fwf-ci:test \
            python -c 'import fun_with_flags, sys; print("🐤 import ok as uid 1000690000 on", sys.version)'
      - name: Gunicorn boots as random UID and serves /
        run: |
          docker run -d --name fwf --user 1000690000:0 -p 8000:8000 \
            -e HATTRICK_OAUTH_CONSUMER_KEY=dummy \
            -e HATTRICK_OAUTH_CONSUMER_SECRET=dummy \
            -e FLASK_SECRET=dummy \
            -e COUCHDB_CONNECTION_STRING=http://127.0.0.1:5984/ \
            fwf-ci:test
          for i in $(seq 1 20); do
            curl -fsS -o /dev/null http://127.0.0.1:8000/ && break
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:8000/
          docker logs fwf 2>&1 | tee boot.log
          ! grep -E '\[ERROR\]|Traceback' boot.log
          docker rm -f fwf


  ci-ok:
    if: always()
    needs: [test, docker-build]
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.test.result }}" = success
          test "${{ needs.docker-build.result }}" = success




