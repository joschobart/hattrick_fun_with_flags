[project]
name = "hattrick-fwf"
version = "1.5.0"
description = "Hattrick Fun with Flags"
authors = [
    { name = "joe", email = "github@schicker.guru" }
]
dependencies = [
    "hattrick-libs>=0.22.0",
    "flask>=3.1.3",
    "cffi>=2.1.1",
    "cryptography>=50.0.0",
    "CouchDB>=1.2",
    "gunicorn>=21.2.0",
    "pygal_maps_world>=1.0.2",
    "apscheduler>=3.10.4,<4",
    "stripe>=8.1.0,<13",
    "flask-babel>=4.0.0",
    "jinja2>=3.1.4",
    "pygal>=3.0.5",
    "beautifulsoup4>=4.13",
    "lxml>=6",
]
readme = "README.rst"
requires-python = ">= 3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fun_with_flags"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "python-dotenv>=1.2.1",
    "ruff>=0.14.10",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests"]
