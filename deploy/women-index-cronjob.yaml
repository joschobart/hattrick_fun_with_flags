apiVersion: batch/v1
kind: CronJob
metadata:
  name: women-index
spec:
  schedule: "15,45 3-6 * * 1"       # Monday 03:15–06:45, 8 slots
  timeZone: "Europe/Zurich"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800   # match the platform cap, so the YAML says what really happens
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: women-index
              image: image-registry.openshift-image-registry.svc:5000/fun-with-flags/fun-with-flags_app-image:latest
              imagePullPolicy: Always
              command: ["python", "-m", "fun_with_flags.crawl_women"]
              env:
                - name: CRAWL_BUDGET_SECONDS
                  value: "1200"   # 20 min
                - name: CRAWLER_FERNET_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: fwf-crawler
                      key: fernet_token
                - name: COUCHDB_CONNECTION_STRING
                  valueFrom:
                    secretKeyRef:
                      name: fwf-crawler-db
                      key: url
                - name: PYTHONUNBUFFERED
                  value: "1"
              resources:
                requests: { cpu: 50m, memory: 256Mi }
                limits: { memory: 768Mi }

